name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validar Documentação e Mermaid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar Markdown, Links GFM e Diagramas Mermaid
        run: |
          python3 scripts/validate-docs.py

  validate-backlog:
    name: Validar Integridade do Backlog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checar Schema e Integridade do Backlog JSON
        run: |
          python3 -c '
          import json, sys
          with open(".github/backlog/hus.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          hus = data.get("hus", [])
          epics = data.get("epics", [])
          assert len(epics) == 3, f"Esperado 3 epicos, encontrado {len(epics)}"
          assert len(hus) == 13, f"Esperado 13 HUs, encontrado {len(hus)}"
          print(f"[OK] Backlog integro: {len(epics)} epicos e {len(hus)} HUs validadas.")
          '

  backend-check:
    name: Checar Backend (NestJS / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verificar se módulo Backend existe
        id: check-backend
        run: |
          if [ -f "backend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Módulo backend ainda não inicializado (execução condicional ignorada)."
          fi

      - name: Configurar Node.js
        if: steps.check-backend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Instalar Dependências, Lint e Testes
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          npm ci
          npm run lint --if-present
          npx tsc --noEmit
          npm test --if-present

  extractor-check:
    name: Checar Extrator PDF (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verificar se módulo Extrator existe
        id: check-extractor
        run: |
          if [ -f "services/pdf-extractor/requirements.txt" ] || [ -f "services/pdf-extractor/pyproject.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Módulo do extrator Python ainda não inicializado (execução condicional ignorada)."
          fi

      - name: Configurar Python
        if: steps.check-extractor.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências, Lint e Testes
        if: steps.check-extractor.outputs.exists == 'true'
        working-directory: services/pdf-extractor
        run: |
          pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install ruff pytest
          ruff check .
          if [ -d "tests" ]; then pytest; fi
